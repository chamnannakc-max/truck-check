<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็กรถบรรทุก 4 ล้อ ก่อนเริ่มงาน</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1c2430;--mu:#667085;--bd:#dde1e7;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--ac:#1d4ed8}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212b;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3441;--ok:#4ade80;--okb:#14351f;--bad:#f87171;--badb:#401616;--ac:#6b9bff}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212b;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3441;--ok:#4ade80;--okb:#14351f;--bad:#f87171;--badb:#401616;--ac:#6b9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--mu);font-size:.9rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 8px}
label{display:block;font-size:.85rem;color:var(--mu);margin-top:8px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row span{flex:1}
.btns{display:flex;gap:6px}
.btns button{min-width:64px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.btns .ok.on{background:var(--okb);color:var(--ok);border-color:var(--ok);font-weight:600}
.btns .bad.on{background:var(--badb);color:var(--bad);border-color:var(--bad);font-weight:600}
.bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.st{font-weight:600}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.act button.sec{background:transparent;color:var(--ac)}
#sum{display:none;margin-top:12px;min-height:160px;font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>🚚 เช็กรถบรรทุก 4 ล้อ ก่อนเริ่มงาน</h1>
<div class="sub" id="date"></div>

<div class="card">
  <h2>ข้อมูลรถ</h2>
  <label>ชื่อผู้ขับ</label><input id="name" autocomplete="off">
  <label>ทะเบียนรถ</label><input id="plate" autocomplete="off">
  <label>เลขไมล์ (กม.)</label><input id="odo" inputmode="numeric" autocomplete="off">
</div>

<div id="list"></div>

<div class="card">
  <h2>หมายเหตุ / ปัญหาที่พบ</h2>
  <textarea id="remark" rows="3" placeholder="เช่น ยางหลังซ้ายลมอ่อน"></textarea>
</div>

<div class="bar"><span class="st" id="st"></span></div>

<div class="act">
  <button id="gen">สร้างสรุปผลเช็ก</button>
  <button id="rst" class="sec">ล้างฟอร์ม</button>
</div>
<textarea id="sum" readonly></textarea>
<div class="act" id="cprow" style="display:none"><button id="cp">คัดลอกสรุป (ส่งเข้าไลน์)</button></div>
</main>

<script>
const G=[
["ภายนอกและยาง",["ตัวถัง/กระจก/กระจกมองข้าง ไม่แตกหรือชำรุด","ยาง 4 เส้น ลมยางและสภาพดอกยาง","ยางอะไหล่ แม่แรง และเครื่องมือ","ป้ายทะเบียนชัดเจน/ภาษีไม่ขาด"]],
["ไฟและสัญญาณ",["ไฟหน้า (ต่ำ/สูง)","ไฟเบรกและไฟท้าย","ไฟเลี้ยวและไฟฉุกเฉิน","แตร"]],
["เครื่องยนต์และของเหลว",["น้ำมันเครื่อง","น้ำหล่อเย็น/หม้อน้ำ","น้ำมันเบรก","น้ำมันเชื้อเพลิงเพียงพอ","แบตเตอรี่","น้ำฉีดกระจกและใบปัดน้ำฝน"]],
["การขับขี่",["เบรกเท้าและเบรกมือ","พวงมาลัย ไม่หลวม/ไม่สั่น","ไฟเตือนบนหน้าปัด ไม่ติดผิดปกติ","แอร์/ที่นั่ง/เข็มขัดนิรภัย"]],
["กระบะและเอกสาร",["พื้นกระบะ/ตู้บรรทุก/ท้ายกระบะ","เชือก ผ้าใบ หรืออุปกรณ์ยึดสินค้า","ใบขับขี่ / พ.ร.บ. / ประกัน","ถังดับเพลิงและชุดเก็บกู้"]]
];
const KEY="truckcheck-v1";
let S={name:"",plate:"",odo:"",remark:"",r:{}};
try{const x=localStorage.getItem(KEY);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const all=[];G.forEach((g,i)=>g[1].forEach((t,j)=>all.push({id:i+"-"+j,t,g:g[0]})));
$("date").textContent=new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

function render(){
  const L=$("list");L.innerHTML="";
  G.forEach((g,i)=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML="<h2>"+g[0]+"</h2>";
    g[1].forEach((t,j)=>{
      const id=i+"-"+j,v=S.r[id];
      const r=document.createElement("div");r.className="row";
      r.innerHTML='<span>'+t+'</span><div class="btns"><button class="ok'+(v==="ok"?" on":"")+'">ปกติ</button><button class="bad'+(v==="bad"?" on":"")+'">ผิดปกติ</button></div>';
      const b=r.querySelectorAll("button");
      b[0].onclick=()=>{S.r[id]=v==="ok"?null:"ok";save();render()};
      b[1].onclick=()=>{S.r[id]=v==="bad"?null:"bad";save();render()};
      c.appendChild(r);
    });
    L.appendChild(c);
  });
  const done=all.filter(a=>S.r[a.id]).length,bad=all.filter(a=>S.r[a.id]==="bad").length;
  $("st").textContent="ตรวจแล้ว "+done+"/"+all.length+(bad?" • ผิดปกติ "+bad+" รายการ":"");
  $("st").style.color=bad?"var(--bad)":(done===all.length?"var(--ok)":"var(--tx)");
}
["name","plate","odo","remark"].forEach(k=>{$(k).value=S[k]||"";$(k).oninput=e=>{S[k]=e.target.value;save()}});

$("gen").onclick=()=>{
  const bad=all.filter(a=>S.r[a.id]==="bad"),un=all.filter(a=>!S.r[a.id]);
  let t="ผลเช็กรถ 4 ล้อ ก่อนเริ่มงาน\nวันที่: "+$("date").textContent+"\nผู้ขับ: "+(S.name||"-")+"\nทะเบียน: "+(S.plate||"-")+"\nเลขไมล์: "+(S.odo||"-")+"\n";
  t+="\nสรุป: "+(bad.length?"❌ พบผิดปกติ "+bad.length+" รายการ":(un.length?"⚠️ ยังตรวจไม่ครบ":"✅ รถพร้อมใช้งาน"))+"\n";
  if(bad.length)t+="\nรายการผิดปกติ:\n"+bad.map(a=>"- "+a.t).join("\n")+"\n";
  if(un.length)t+="\nยังไม่ได้ตรวจ "+un.length+" รายการ\n";
  if(S.remark)t+="\nหมายเหตุ: "+S.remark+"\n";
  $("sum").style.display="block";$("sum").value=t;$("cprow").style.display="flex";
  $("sum").scrollIntoView({behavior:"smooth"});
};
$("cp").onclick=()=>{
  const s=$("sum");s.select();
  try{navigator.clipboard.writeText(s.value).catch(()=>document.execCommand("copy"))}catch(e){}
  $("cp").textContent="คัดลอกแล้ว ✓";setTimeout(()=>$("cp").textContent="คัดลอกสรุป (ส่งเข้าไลน์)",1500);
};
$("rst").onclick=()=>{
  if(!confirm("ล้างข้อมูลทั้งหมดเพื่อเริ่มเช็กรอบใหม่?"))return;
  S={name:S.name,plate:"",odo:"",remark:"",r:{}};save();
  ["name","plate","odo","remark"].forEach(k=>$(k).value=S[k]);
  $("sum").style.display="none";$("cprow").style.display="none";render();
};
render();
</script>
</body>
</html>
